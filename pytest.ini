[pytest]
# RhinoSpotter. Run `pytest` from the plugin folder - conftest puts that folder
# on sys.path, which EDMC does for us at runtime and pytest does not.

testpaths = rs_tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

addopts =
    -v
    --tb=short
    --strict-markers
    -ra

markers =
    unit: one function, no files and no network

[coverage:run]
source =
    rs_core
omit =
    */rs_tests/*
    */lib/*

[coverage:report]
precision = 2
show_missing = True
